<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수원 급매</title>
<meta name="description" content="수원시 아파트 실거래·호가로 급매를 찾는 앱">
<meta name="theme-color" content="#F5F7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1214" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수원 급매">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== 디자인 토큰 (ui-ux-pro-max: Minimal/Swiss + 부동산 trust teal) =====
   주색은 청록(teal). 파랑·빨강은 하락·상승 의미로만 씀 (한국식: 오름=빨강, 내림=파랑)
   본문·보조 글자는 배경 대비 4.5:1 이상 */
:root {
  --bg: #F5F7F7; --card: #FFFFFF; --ink: #111827; --ink-2: #47515C; --muted: #5F6974;
  --line: #E3E8EA; --soft: #EFF3F3; --brand: #0F766E; --on-brand: #FFFFFF; --brand-soft: #E6F4F2;
  --up: #D92D36; --down: #2563C9;
  --gA: #C42530; --gA-bg: #FDECEC; --gB: #AD4A05; --gB-bg: #FEF1E3; --gC: #8A6A00; --gC-bg: #FDF6DC;
  --ok: #4B5563; --ok-bg: #EEF1F3; --grid: #EDF1F2; --focus: #0F766E;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.05);
  --r: 18px; --tab: 64px; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1214; --card: #181C1F; --ink: #EEF2F3; --ink-2: #B8C1C6; --muted: #949DA8;
    --line: #283035; --soft: #20262A; --brand: #2DD4BF; --on-brand: #042F2E; --brand-soft: #123532;
    --up: #F2666C; --down: #6E9BF0;
    --gA: #F2666C; --gA-bg: #3A1D20; --gB: #F29A45; --gB-bg: #3A2814; --gC: #E2BC3A; --gC-bg: #352D12;
    --ok: #A3ADB6; --ok-bg: #252C31; --grid: #232A2E; --focus: #5EEAD4; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1214; --card: #181C1F; --ink: #EEF2F3; --ink-2: #B8C1C6; --muted: #949DA8;
  --line: #283035; --soft: #20262A; --brand: #2DD4BF; --on-brand: #042F2E; --brand-soft: #123532;
  --up: #F2666C; --down: #6E9BF0;
  --gA: #F2666C; --gA-bg: #3A1D20; --gB: #F29A45; --gB-bg: #3A2814; --gC: #E2BC3A; --gC-bg: #352D12;
  --ok: #A3ADB6; --ok-bg: #252C31; --grid: #232A2E; --focus: #5EEAD4; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.5; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tab) + env(safe-area-inset-bottom) + 8px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* 상단 */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
.top h1 { font-size: 20px; font-weight: 750; margin: 0; flex: 1; letter-spacing: -0.025em; display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: var(--on-brand);
  display: inline-grid; place-items: center; flex-shrink: 0; }
.logo svg { width: 16px; height: 16px; }
.top.has-back .logo { display: none; }
.top .sub { font-size: 12.5px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.back { display: none; border: 0; background: none; width: 44px; height: 44px; margin-left: -12px; border-radius: 12px; place-items: center; }
.back svg { width: 24px; height: 24px; }
.top.has-back .back { display: grid; }
.back:active { background: var(--soft); }

/* 카드 · 섹션 */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin: 12px 0;
  border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 28px 2px 4px; }
.sec-title h2 { font-size: 18px; font-weight: 750; margin: 0; letter-spacing: -0.02em; }
.sec-title span { font-size: 12.5px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 4px; line-height: 1.55; }

/* 홈: 대표 카드 */
.hero { background: var(--brand); color: var(--on-brand); border: 0; padding: 18px 18px 8px; }
.hero .l { font-size: 13px; opacity: .9; font-weight: 600; }
.hero .v { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-top: 2px; }
.hero .d { font-size: 13px; opacity: .9; margin-top: 2px; }
.hero .spark { height: 72px; margin: 8px -6px 0; position: relative; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px;
  border: 1px solid color-mix(in srgb, var(--line) 60%, transparent); min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 20px; font-weight: 750; margin-top: 2px; letter-spacing: -0.02em; white-space: nowrap; }
.kpi .d { font-size: 12px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up { color: var(--up); } .down { color: var(--down); }

/* 등급 뱃지 (글자로도 구분) */
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px;
  padding: 0 8px; border-radius: 8px; font-size: 13px; font-weight: 800; flex-shrink: 0; }
.bA { color: var(--gA); background: var(--gA-bg); } .bB { color: var(--gB); background: var(--gB-bg); }
.bC { color: var(--gC); background: var(--gC-bg); } .bN { color: var(--ok); background: var(--ok-bg); }

/* 리스트 (버튼) */
.list { padding: 4px 6px; }
.item { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 60px; padding: 10px; text-align: left;
  border: 0; background: none; border-radius: 12px; position: relative; transition: background-color .12s var(--ease); }
.item + .item::before { content: ""; position: absolute; top: 0; left: 10px; right: 10px; border-top: 1px solid var(--line); }
.item:active { background: var(--soft); }
@media (hover: hover) { .item:hover { background: var(--soft); } }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .r { text-align: right; flex-shrink: 0; }
.item .r .p { font-weight: 750; }
.item .r .s { font-weight: 600; }
.chev { color: var(--muted); flex-shrink: 0; }

/* 검색 */
.search { position: relative; margin-top: 8px; }
.search input { width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
  padding: 0 14px 0 44px; font-size: 16px; box-shadow: var(--shadow); transition: border-color .15s; }
.search input:focus { border-color: var(--brand); }
.search > svg { position: absolute; left: 14px; top: 16px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.sugg { position: absolute; left: 0; right: 0; top: 58px; z-index: 4; background: var(--card); border-radius: 14px;
  border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.16); padding: 4px; max-height: 340px; overflow: auto; }
.sugg:empty { display: none; }

/* 칩 */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 16px;
  font-size: 15px; transition: background-color .12s, border-color .12s; }
.chip:active { background: var(--soft); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.chip .py { opacity: .75; font-weight: 500; }

/* 입력 */
.field { margin-top: 16px; }
.field label { display: block; font-size: 13.5px; color: var(--ink-2); margin-bottom: 6px; font-weight: 650; }
.field input { width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft);
  padding: 0 14px; font-size: 18px; font-weight: 600; transition: border-color .15s, background-color .15s; }
.field input:focus { border-color: var(--brand); background: var(--card); }
.field input:focus-visible, .search input:focus-visible { outline: none; }
.field input[aria-invalid="true"] { border-color: var(--up); }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.hint.err { color: var(--up); font-weight: 650; }

/* 판정 결과 */
.verdict { text-align: center; padding: 24px 16px 18px; }
.verdict .big { display: inline-flex; align-items: center; justify-content: center; width: 68px; height: 68px;
  border-radius: 22px; font-size: 32px; font-weight: 850; }
.verdict .msg { font-size: 21px; font-weight: 800; margin-top: 12px; letter-spacing: -0.025em; }
.verdict .why { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.range { position: relative; height: 10px; border-radius: 5px; background: var(--soft); margin: 34px 10px; }
.range .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--brand-soft); }
.range .mk { position: absolute; top: -6px; width: 2px; height: 22px; transform: translateX(-1px); }
.range .mk span { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; }
.range .mk.base { background: var(--muted); } .range .mk.base span { top: 25px; color: var(--muted); }
.range .mk.you { background: var(--ink); width: 3px; border-radius: 2px; } .range .mk.you span { bottom: 25px; font-weight: 750; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat3 > div { background: var(--soft); border-radius: 12px; padding: 10px 4px; min-width: 0; }
.stat3 .l { font-size: 12px; color: var(--muted); } .stat3 .v { font-weight: 750; font-size: 16px; white-space: nowrap; }
.basis { font-size: 13px; color: var(--ink-2); background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 14px; text-align: left; line-height: 1.6; }

.nvbox { display: flex; align-items: center; gap: 12px; }
.nvbox .main { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px;
  border-radius: 12px; border: 0; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 14.5px;
  white-space: nowrap; transition: filter .12s; }
.btn:active { filter: brightness(.94); }
.btn.solid { background: var(--brand); color: var(--on-brand); width: 100%; height: 52px; font-size: 16px; margin-top: 12px; }
.star { border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
  color: var(--muted); margin-right: -8px; flex-shrink: 0; }
.star:active { background: var(--soft); }
.star[aria-pressed="true"] { color: #E5A500; }
.star svg { width: 26px; height: 26px; }

.chart { position: relative; height: 200px; }
table.tr { width: 100%; border-collapse: collapse; font-size: 15px; }
table.tr td { padding: 11px 2px; border-top: 1px solid var(--line); }
table.tr tr:first-child td { border-top: 0; }
table.tr td:last-child { text-align: right; font-weight: 700; }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; }
.empty svg { width: 40px; height: 40px; color: var(--muted); opacity: .5; display: block; margin: 0 auto 10px; }
ul.ins { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
ul.ins li { margin: 5px 0; }

/* 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab); padding: 0; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 12px; color: var(--muted); font-weight: 600; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button .ic { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background-color .15s; }
.tabbar button[aria-current="page"] { color: var(--brand); font-weight: 750; }
.tabbar button[aria-current="page"] .ic { background: var(--brand-soft); }
.view { display: none; padding-bottom: 24px; }
.view.on { display: block; animation: fadein .18s var(--ease); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 불러오는 중: 자리 표시 */
.sk { background: linear-gradient(90deg, var(--soft) 25%, var(--line) 50%, var(--soft) 75%); background-size: 200% 100%;
  animation: shimmer 1.2s infinite linear; border-radius: var(--r); margin: 12px 0; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.item .main, .item .r, .item .t, .item .s, .item .p { display: block; }
.item .s.down { color: var(--down); } .item .s.up { color: var(--up); }
.more { width: 100%; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--brand);
  font-weight: 700; font-size: 14.5px; margin-top: 4px; border-radius: 0 0 12px 12px; }
.more:active { background: var(--soft); }
.regions { display: flex; gap: 6px; overflow-x: auto; margin: 4px -16px 12px; padding: 2px 16px; scrollbar-width: none; }
.regions::-webkit-scrollbar { display: none; }
.regions .chip { min-height: 40px; padding: 0 14px; font-size: 14.5px; flex-shrink: 0; }
.gtag { font-size: 11.5px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.infobox { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; padding: 8px 10px; border-radius: 10px;
  background: var(--soft); color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.infobox svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--muted); }
.sumnote { margin-top: 14px; align-items: center; font-size: 12px; padding: 8px 9px; gap: 5px; letter-spacing: -0.02em; }
.sumnote .ics { display: inline-flex; gap: 2px; flex-shrink: 0; }
.sumnote .ics svg { width: 15px; height: 15px; margin-top: 0; color: inherit; }
.sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sumgrid > div { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.sumgrid .l { font-size: 12px; color: var(--muted); }
.sumgrid .v { font-size: 17px; font-weight: 750; margin-top: 1px; }
.sumgrid .d { font-size: 12px; color: var(--ink-2); }
.rank { margin-top: 16px; }
.rank h3 { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; margin: 0 0 4px; }
.rank h3 svg { width: 16px; height: 16px; }
.rank .row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 4px; border: 0;
  background: none; border-top: 1px solid var(--line); text-align: left; border-radius: 0; }
.rank .row:first-of-type { border-top: 0; }
.rank .row:active { background: var(--soft); }
.rank .no { width: 20px; color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; flex-shrink: 0; }
.rank .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .vv { font-weight: 750; flex-shrink: 0; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-top: 8px; padding: 8px 10px;
  border-radius: 10px; background: var(--soft); font-size: 12.5px; color: var(--ink-2); }
.legend .badge { min-width: 20px; height: 20px; font-size: 11.5px; padding: 0 5px; margin-right: 2px; }
.legend span { display: inline-flex; align-items: center; white-space: nowrap; }
.legend .def { flex-basis: 100%; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <button class="back" id="backBtn" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M12 9v9M8.5 14.5L12 18l3.5-3.5"/></svg></span><span id="title">수원 급매</span></h1>
    <span class="sub" id="updated"></span>
  </div>
</header>

<main class="wrap">
  <div id="loading" aria-busy="true" aria-label="불러오는 중"><div class="sk" style="height:168px"></div><div class="sk" style="height:76px"></div><div class="sk" style="height:260px"></div></div>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-judge"></section>
  <section class="view" id="v-cx"></section>
  <section class="view" id="v-fav"></section>
</main>

<nav class="tabbar" aria-label="화면 이동">
  <div class="wrap">
    <button data-tab="home"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>홈</button>
    <button data-tab="judge"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>매물 판정</button>
    <button data-tab="cx"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg></span>단지</button>
    <button data-tab="fav"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>관심</button>
  </div>
</nav>

<script>
"use strict";
// ---------------- 공통 ----------------
const $ = s => document.querySelector(s);

function groups(ci) {
  const rows = BY[ci] || [];
  const areas = [...new Set(rows.map(r => r.a))].sort((a, b) => a - b);
  const out = []; let cur = [], prev = null;
  for (const a of areas) { if (prev != null && a - prev > D.rules.tol) { out.push(cur); cur = []; } cur.push(a); prev = a; }
  if (cur.length) out.push(cur);
  return out.map(as => {
    const rs = rows.filter(r => as.includes(r.a)).sort((x, y) => y.d - x.d);
    const ar = median(rs.map(r => r.a));
    return { area: ar, rows: rs, ...base(rs, D.complexes[ci].g) };
  });
}
function median(a) { const s = [...a].sort((x, y) => x - y), n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : null; }
// 구별 월별 가격지수 (기준월=1). 기준월 이후는 1, 자료 이전은 첫 달 값
function idxOf(gu, ym) {
  const ix = D.index[gu] || D.index[ALL];
  if (ix[ym] != null) return ix[ym];
  const ks = Object.keys(ix).sort();
  return ym < ks[0] ? ix[ks[0]] : 1;
}
const ymOf = n => `${String(n).slice(0, 4)}-${String(n).slice(4, 6)}`;
// 기준가 = 최근 6개월(부족하면 12개월) 거래를 오늘 시세로 환산(시점 보정)한 중앙값
function base(rows, gu) {
  for (const m of D.rules.months) {
    const from = new Date(TODAY); from.setDate(from.getDate() - 30 * m);
    const w = rows.filter(r => r.dt > from);
    if (w.length >= D.rules.min) {
      const f2 = new Date(TODAY); f2.setDate(f2.getDate() - 60);
      const r2 = rows.filter(r => r.dt > f2);
      return { base: median(w.map(r => r.p / idxOf(gu, ymOf(r.d)))), raw: median(w.map(r => r.p)), months: m, comps: w,
               recent2: r2.length >= 3 ? median(r2.map(r => r.p)) : null };
    }
  }
  return { base: null, raw: null, months: null, comps: [], recent2: null };
}
const baseNote = g => `보정 전 ${eok2(g.raw)}${g.recent2 ? ` · 최근 2개월 실거래 중앙 ${eok2(g.recent2)}` : ""}`;
function gradeOf(disc) { for (const [g, th] of D.rules.grades) if (disc >= th) return g; return ""; }
function parsePrice(t) {
  t = String(t).replace(/\s/g, "");
  let m = t.match(/^(\d+(?:\.\d+)?)억(?:(\d[\d,]*)(천)?(?:만원|만)?)?$/);
  if (m) { let v = parseFloat(m[1]) * 10000; if (m[2]) { const r = +m[2].replace(/,/g, ""); v += m[3] ? r * 1000 : r; } return Math.round(v); }
  m = t.match(/^(\d+(?:\.\d+)?)$/);
  if (m) { const v = parseFloat(m[1]); return v < 100 ? Math.round(v * 10000) : Math.round(v); }   // 3.5 → 3.5억, 35000 → 만원
  m = t.match(/^(\d[\d,]*)(?:만원|만)$/);
  if (m) return +m[1].replace(/,/g, "");
  return null;
}
function searchCx(q) {
  const nq = norm(q); if (!nq) return [];
  return D.complexes.map((c, i) => {
    const names = [norm(c.n)]; if (c.nv) names.push(norm(c.nv.name));
    let s = 0;
    for (const n of names) {
      if (n === nq) s = Math.max(s, 100);
      else if (n.startsWith(nq)) s = Math.max(s, 80);
      else if (n.includes(nq)) s = Math.max(s, 60);
      else if (nq.includes(n) && n.length >= 2) s = Math.max(s, 40);
    }
    if (c.d.startsWith(q.trim()) || c.g.startsWith(q.trim())) s = Math.max(s, 30);
    return { i, s: s + Math.min(c.cnt, 300) / 300 };
  }).filter(x => x.s >= 1).sort((a, b) => b.s - a.s).slice(0, 30).map(x => x.i);
}

  if (tab === "cx" && ci != null && D.complexes[+ci]) CX.ci = +ci;
  const t = ["home", "judge", "cx", "fav"].includes(tab) ? tab : "home";
  history.replaceState({ tab: t, ci: CX.ci }, "", "#" + t + (CX.ci != null ? "/" + CX.ci : ""));
  go(t, CX.ci != null, false);
}).catch(err => { const l = $("#loading"); l.removeAttribute("aria-busy"); l.innerHTML = empty("자료를 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요."); console.error(err); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
